provider:
  type: gemini
  model: gemini-3.1-flash-live-preview
  voice: Aoede

voice:
  wake_word: atlas
  language: es-CL

memory:
  enabled: true

vision:
  enabled: true

ui:
  overlay_enabled: true
  overlay_port: 7890
  auto_open_browser: false

developer_agent:
  enabled: true
  provider: "cliproxy"
  base_url: "${CLIPROXY_BASE_URL:-http://127.0.0.1:8317/v1}"
  api_key: "${CLIPROXY_API_KEY:-YOUR_CLIPROXY_API_KEY}"
  model: "gemini-3.7-flash-high"
  temperature: 0.2
  max_iterations: 15

# Servidores MCP (Model Context Protocol) externos
mcp_servers: {}
  # Ejemplo de servidor MCP filesystem:
  # filesystem:
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/home/jonathan"]
