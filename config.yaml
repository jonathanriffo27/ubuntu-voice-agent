provider:
  type: gemini
  model: gemini-3.8-live
  voice: Aoede

voice:
  mode: wake_word            # "wake_word" (estilo Ok Google) o "always_on"
  wake_word: alexa           # "alexa", "hey_jarvis", "hey_mycroft" o ruta a .onnx
  wake_word_threshold: 0.55  # Subido de 0.28: falsos positivos de TV/audio ambiental disparaban a ~0.50; reales observados: 0.62-0.99
  follow_up_timeout: 7.0     # Ventana para repreguntar sin repetir wake word
  activation_sound: true     # Reproduce ding al despertar
  language: es-CL
  server_vad: false          # true = VAD nativo de Gemini cierra el turno. OBLIGATORIO en gemini-3.8 (se fuerza solo): audio_stream_end es ignorado por ese modelo
  affective_dialog: false    # true = voz con entonación afectiva/emocional nativa

memory:
  enabled: true

vision:
  enabled: true

ui:
  overlay_enabled: true
  overlay_port: 7890
  auto_open_browser: false

developer_agent:
  enabled: true
  provider: "cliproxy"
  base_url: "${CLIPROXY_BASE_URL:-http://127.0.0.1:8317/v1}"
  api_key: "${CLIPROXY_API_KEY}"  # Sin fallback hardcodeado: exporta CLIPROXY_API_KEY en tu entorno
  model: "gemini-3.7-flash-high"
  temperature: 0.2
  max_iterations: 15

# Servidores MCP (Model Context Protocol) externos
mcp_servers: {}
  # Ejemplo de servidor MCP filesystem:
  # filesystem:
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/home/jonathan"]
