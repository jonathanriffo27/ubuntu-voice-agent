provider:
  type: gemini
  model: gemini-3.8-live
  voice: Aoede
  # Fallback temporal si gemini-3.8-live queda no disponible (1011/503 del
  # backend de Live, p. ej. saturación). Solo de runtime: `model` NO se
  # modifica, así al recuperarse el primario (o al reiniciar Atlas) se vuelve
  # a 3.8 automáticamente. Vacío = sin fallback.
  fallback_model: gemini-3.1-flash-live-preview
  fallback_after_failures: 2       # fallos "no disponible" seguidos para activarlo
  fallback_probe_interval: 300     # cada cuántos segundos sondea si 3.8 volvió

voice:
  mode: wake_word            # "wake_word" (estilo Ok Google) o "always_on"
  wake_word: alexa           # "alexa", "hey_jarvis", "hey_mycroft" o ruta a .onnx
  wake_word_threshold: 0.62  # Reales observados: 0.94-0.99 | Falsos: ~0.55 (ruido) y 0.85 (chime "sleep"). La gracia post-sueño en recorder.py cubre los residuales por encima del umbral
  follow_up_timeout: 7.0     # Ventana para repreguntar sin repetir wake word
  activation_sound: true     # Reproduce ding al despertar
  language: es-CL
  server_vad: false          # true = VAD nativo de Gemini cierra el turno. OBLIGATORIO en gemini-3.8 (se fuerza solo): audio_stream_end es ignorado por ese modelo
  affective_dialog: false    # true = voz con entonación afectiva/emocional nativa

memory:
  enabled: true

vision:
  enabled: true

ui:
  overlay_enabled: true
  overlay_port: 7890
  # Bindeo del HUD. 127.0.0.1 = solo este PC (recomendado: el HUD expone
  # trayectoria/correos y aprobaciones). 0.0.0.0 = toda la red local.
  overlay_host: 127.0.0.1
  auto_open_browser: false

developer_agent:
  enabled: true
  provider: "cliproxy"
  base_url: "${CLIPROXY_BASE_URL:-http://127.0.0.1:8317/v1}"
  api_key: "${CLIPROXY_API_KEY}"  # Sin fallback hardcodeado: exporta CLIPROXY_API_KEY en tu entorno
  model: "gemini-3.8-flash-high"
  temperature: 0.2
  max_iterations: 15

# Servidores MCP (Model Context Protocol) externos
mcp_servers: {}
  # Ejemplo de servidor MCP filesystem:
  # filesystem:
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/home/jonathan"]
