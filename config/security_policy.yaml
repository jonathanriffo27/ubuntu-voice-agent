# 🛡️ Política de seguridad por tiers de Atlas (ver src/security/policy.py)
#
# Tier 1 (read_only):   lectura pasiva -> auto-aprobada
# Tier 2 (local_write): escritura local reversible -> aprobación según herramienta
# Tier 3 (irreversible): enviar mensajes, borrar, shell arbitrario -> HITL SIEMPRE
#
# Los patrones usan sintaxis glob (fnmatch) contra el NOMBRE de la acción/herramienta.
# La escalación por contenido (escalation_patterns) inspecciona el payload y siempre gana.

default_tier: 2

tiers:
  read_only:
    - "analizar_pantalla"
    - "capturar_pantalla*"     # incluye capturar_pantalla_desarrollo del subagente
    - "leer_archivo"
    - "listar_directorio"
    - "buscar_*"
    - "consultar_*"
    - "obtener_*"
    - "listar_*"
    - "leer_*"
    - "que_suena"
    - "ver_*"
    - "navegador_web.leer"     # contenido web entra con spotlighting (no confiable)
    - "navegador_web.elementos"
    - "navegador_web.pestanas"
    - "navegador_web.captura"

  local_write:
    - "interactuar_gui"        # contenido sensible eleva a tier 3 automáticamente
    - "navegador_web.abrir"
    - "navegador_web.click"    # el payload (nombre del botón) se clasifica aparte
    - "navegador_web.escribir"
    - "navegador_web.tecla"
    - "navegador_web.scroll"
    - "navegador_web.atras"
    - "navegador_web.cerrar"
    - "abrir_*"
    - "cerrar_aplicacion"
    - "reproducir_*"
    - "controlar_musica"
    - "escribir_archivo"       # el propio AgentCodeTools ya pide HITL con diff
    - "crear_*"
    - "editar_*"
    - "ajustar_*"
    - "silenciar*"
    - "imprimir_en_consola"
    - "agendar_*"
    - "crear_recordatorio"

  irreversible:
    - "enviar_*"               # mensajes WhatsApp/Telegram, correos...
    - "*correo*"
    - "ejecutar_comando*"      # shell del subagente (ya pasa por HITL)
    - "ejecutar_shell*"
    - "proponer_comando"
    - "git_push"
    - "borrar_*"
    - "eliminar_*"
    - "pagar*"

# Patrones sobre el CONTENIDO (regex, case-insensitive) que elevan cualquier
# acción a Tier 3 aunque su nombre parezca inofensivo.
escalation_patterns:
  - '\brm\s+-rf?\b'
  - '\bsudo\b'
  - '\bgit\s+push\b'
  - '\b(cvv|tarjeta|card\s*number|\d{13,16})\b'
  - '(confirmar\s+compra|realizar\s+pago|transferencia)'
  - '(eliminar\s+todo|borrar\s+todo|formatear)'
  # Botones/envíos web: cualquier click o texto que huela a acción irreversible
  # en el navegador (el nombre del botón va en el payload de navegador_web.*)
  - '(enviar\s+(mensaje|formulario|solicitud|pago)|publicar\s+(comentario|anuncio|post))'
  - '(confirmar\s+(pedido|pago|compra)|finalizar\s+compra|passkey|cerrar\s+sesi[oó]n)'
  # Material criptográfico y credenciales: leer ~/.ssh/id_rsa o .env NUNCA es
  # lectura inocua aunque la herramienta sea de solo-lectura (proponer_comando,
  # leer_archivo, navegador_web.leer...). Cubre el incidente 'cat ~/.ssh/id_rsa'.
  - '(\.ssh/|\.gnupg/|\.aws/|id_rsa|id_ed25519|id_ecdsa|\.pem\b|\.key\b)'
  - '\.env\b'
  - '(credentials\.json|client_secret|api[_-]?key\s*=|access[_-]?token\s*=)'
