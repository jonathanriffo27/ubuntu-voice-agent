name: Atlas CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install Linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black mypy
    # - name: Check formatting with black
    #   run: black --check src/
    # - name: Lint with ruff
    #   run: ruff check src/
    # - name: Type check with mypy
    #   run: mypy src/ --ignore-missing-imports
    # Descomentaremos estas líneas cuando el código esté completamente tipado y formateado

  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev python3-pyaudio
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Atlas Doctor
      run: |
        # Usamos Atlas Doctor como test de humo para validar
        # importaciones y carga de plugins.
        python doctor.py
